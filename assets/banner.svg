<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="wafer-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 4 4; }
    .wafer-grid { stroke: #0284c7; stroke-width: 1; stroke-opacity: 0.3; }
    
    @keyframes laser-scan {
      0% { transform: translateX(0px); opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { transform: translateX(1100px); opacity: 0.2; }
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    @keyframes chart-wave {
      0% { stroke-dashoffset: 1000; }
      50% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1000; }
    }

    @keyframes status-blink {
      0%, 100% { fill: #10b981; filter: drop-shadow(0 0 8px #10b981); }
      50% { fill: #34d399; filter: drop-shadow(0 0 14px #34d399); }
    }

    .scanner { animation: laser-scan 4s ease-in-out infinite alternate; }
    .pulse-node { transform-origin: center; animation: pulse-glow 3s ease-in-out infinite; }
    .spc-line { stroke-dasharray: 1000; animation: chart-wave 12s linear infinite; }
    .status-led { animation: status-blink 2s ease-in-out infinite; }
  </style>

  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <g opacity="0.4">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" class="grid-line" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" class="grid-line" />
  </g>

  <g transform="translate(920, 200)">
    <circle r="140" fill="url(#wafer-grad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" />
    <circle r="100" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.6" />
    <circle r="60" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    
    <path d="M -90,-60 H 90 M -110,-30 H 110 M -120,0 H 120 M -110,30 H 110 M -90,60 H 90" class="wafer-grid" />
    <path d="M -60,-90 V 90 M -30,-110 V 110 M 0,-120 V 120 M 30,-110 V 110 M 60,-90 V 90" class="wafer-grid" />

    <circle cx="-30" cy="-30" r="4" fill="#10b981" class="pulse-node" />
    <circle cx="30" cy="-30" r="4" fill="#38bdf8" class="pulse-node" />
    <circle cx="-30" cy="30" r="4" fill="#8b5cf6" class="pulse-node" />
    <circle cx="30" cy="30" r="4" fill="#10b981" class="pulse-node" />
    <circle cx="0" cy="0" r="5" fill="#f59e0b" class="status-led" />
  </g>

  <g transform="translate(80, 250)">
    <line x1="0" y1="-60" x2="650" y2="-60" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.7" />
    <text x="660" y="-56" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">UCL</text>

    <line x1="0" y1="0" x2="650" y2="0" stroke="#10b981" stroke-width="1.5" opacity="0.5" />
    <text x="660" y="4" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">CENTER</text>

    <line x1="0" y1="60" x2="650" y2="60" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.7" />
    <text x="660" y="64" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">LCL</text>

    <path d="M 0,10 Q 50,-40 100,-10 T 200,20 T 300,-35 T 400,15 T 500,-25 T 600,5 L 650,-10" 
          fill="none" stroke="url(#accent-grad)" stroke-width="3.5" filter="url(#soft-glow)" class="spc-line" />
    
    <circle cx="100" cy="-10" r="4" fill="#38bdf8" />
    <circle cx="200" cy="20" r="4" fill="#38bdf8" />
    <circle cx="300" cy="-35" r="5" fill="#f59e0b" filter="url(#soft-glow)" />
    <circle cx="400" cy="15" r="4" fill="#38bdf8" />
    <circle cx="500" cy="-25" r="4" fill="#38bdf8" />
  </g>

  <g class="scanner">
    <line x1="50" y1="20" x2="50" y2="380" stroke="#06b6d4" stroke-width="2" filter="url(#glow)" opacity="0.8" />
    <rect x="48" y="20" width="4" height="360" fill="#38bdf8" opacity="0.3" />
  </g>

  <g transform="translate(80, 95)">
    <rect x="0" y="-32" width="250" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="15" cy="-19" r="4" fill="#10b981" class="status-led" />
    <text x="28" y="-14" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">SEMICONDUCTOR FAB SPC</text>

    <text x="0" y="25" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">Awesome Semiconductor</text>
    <text x="0" y="70" fill="url(#accent-grad)" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#soft-glow)">Process Control</text>
    <text x="0" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15" font-weight="400">Curated Ecosystem for Yield Management, FDC, Metrology Analytics &amp; SPC Software</text>
  </g>
</svg>
